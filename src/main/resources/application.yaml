spring:
  profiles:
    active: dev
  application:
    name: borapagar
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  security:
    oauth2:
      client:
        registration:
          sigaa:
            client-id: ${SIGAA_CLIENT_ID}
            client-secret: ${SIGAA_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/sigaa"
        provider:
          sigaa:
            userNameAttribute: login
            authorization-uri: ${sigaa.auth-base-url}/authz-server/oauth/authorize
            token-uri: ${sigaa.auth-base-url}/authz-server/oauth/token
            user-info-uri: ${sigaa.api-base-url}/usuario/v1/usuarios/info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

sigaa:
    auth-base-url: https://autenticacao.ufrn.br
    api-base-url: https://api.ufrn.br
    api-key: ${SIGAA_API_KEY:}
    client-id: ${SIGAA_CLIENT_ID:}
    client-secret: ${SIGAA_CLIENT_SECRET:}
    token-uri: ${sigaa.auth-base-url}/authz-server/oauth/token

frontend:
  url: ${FRONTEND_URL:http://localhost:8080}
  redirect: ${FRONTEND_URL:http://localhost:8080}/dashboard

